syntax = "proto3";
package mission;

// All distances are metres, angles radians, timestamps Unix nanoseconds unless
// time_domain explicitly identifies a device clock. One Envelope per WS message.
message Vec3 { double x = 1; double y = 2; double z = 3; }
message Quaternion { double x = 1; double y = 2; double z = 3; double w = 4; }
message Hello { string name = 1; repeated string capabilities = 2; }
message Heartbeat { uint64 uptime_ms = 1; }
enum TaskMode { MODE_UNKNOWN = 0; REAL = 1; SIMULATION = 2; MODE_CONFLICT = 3; }
message VehicleState {
  string frame_id = 1; string map_id = 2; Vec3 position = 3;
  Quaternion orientation = 4; Vec3 velocity = 5;
  bool pose_valid = 6; bool velocity_valid = 7;
  bool battery_valid = 8; double battery_percent = 9;
  // From a fresh, connected /mavros/state sample. False for old agents.
  bool fcu_state_valid = 10; bool armed = 11; string flight_mode = 12;
}
message CompanionStatus {
  string odin = 1; string ego = 2; string localization = 3;
  bool video_running = 4; bool recording = 5;
  double cloud_hz = 6; double network_mbps = 7;
  double cpu_percent = 8; double disk_free_gb = 9;
  TaskMode task_mode = 10;
}
message CloudFrame {
  enum Layout { XYZ_RGB_LE16 = 0; }
  string frame_id = 1; string map_id = 2; uint32 point_count = 3;
  Layout layout = 4; bytes point_data = 5; bool snapshot = 6;
  // Each point: float32 LE x,y,z, uint8 r,g,b,reserved. No compression in v1.
}
message TrajectoryPoint { Vec3 position = 1; double time_from_start_s = 2; }
// Complete local occupancy snapshot, independent of the displayed sensor cloud.
// Empty centers clears the grid. Centers and resolution are in metres.
message VoxelGrid {
  string frame_id = 1; string map_id = 2; double resolution_m = 3;
  repeated Vec3 centers = 4; bool inflated = 5;
  // A delta applies only to base_version. A full snapshot has delta=false.
  uint64 version = 6; uint64 base_version = 7; bool delta = 8;
  repeated Vec3 added = 9; repeated Vec3 removed = 10;
}
// Poses use the same world frame as CloudFrame. Camera axes are optical
// (+Z forward, +X right, +Y down); lidar axes follow Odin FLU.
message OdinSensorPose {
  string frame_id = 1; string map_id = 2; uint64 sample_time_ns = 3;
  Vec3 camera_position = 4; Quaternion camera_orientation = 5;
  Vec3 lidar_position = 6; Quaternion lidar_orientation = 7;
  double inflation_m = 8; double grid_resolution_m = 9;
  bool inflation_valid = 10;
  bool camera_valid = 11; bool lidar_valid = 12;
  bool inflation_runtime = 13;
}
// Image pixels sampled only at visible 3-D cloud points. Same LE16 layout as
// CloudFrame; no image rectangle is displayed at an arbitrary depth plane.
message OdinProjection {
  string frame_id = 1; string map_id = 2; uint64 capture_time_ns = 3;
  uint32 point_count = 4; bytes point_data = 5;
  Vec3 camera_position = 6; Quaternion camera_orientation = 7;
}
message PlannerTrajectory {
  enum State { VALID = 0; FAILED = 1; CANCELLED = 2; }
  string trajectory_id = 1; string frame_id = 2; string map_id = 3;
  uint64 start_time_ns = 4; repeated TrajectoryPoint points = 5;
  State state = 6; string detail = 7;
}
message Waypoint {
  Vec3 position = 1; double yaw = 2; double speed = 3;
  double hold_s = 4; // dwell_time in the EGO YAML; only Detect/Land points may dwell.
  string pointmode = 5; // Empty means legacy Pass_through.
  double inspection_pitch_deg = 6;
  optional double inspection_zoom_ratio = 7; // Absent means legacy default 1.0.
}
message MissionPlan {
  string mission_id = 1; string map_id = 2; string frame_id = 3;
  uint32 revision = 4; repeated Waypoint waypoints = 5;
}
message Command {
  enum Kind { UNSPECIFIED = 0; START_ODIN = 1; START_EGO = 2; END_MISSION = 3;
    VIDEO_START = 4; VIDEO_STOP = 5; RECORD_START = 6; RECORD_STOP = 7;
    SAVE_MAP = 8; GET_CONFIG = 9; SET_CONFIG = 10; UPLOAD_MISSION = 11; GET_FILE = 12;
    GET_YAML_CATALOG = 13; GET_YAML_DOCUMENT = 14; PATCH_YAML_DOCUMENT = 15;
    GET_ODIN_MAPS = 16; GET_TIME = 17; SET_TIME = 18; SET_TASK_MODE = 19;
    REPLAY_START = 20; REPLAY_PAUSE = 21; REPLAY_RESUME = 22;
    REPLAY_SEEK = 23; REPLAY_STOP = 24; REPLAY_SPEED = 25;
    GET_REPLAY_STATUS = 26; }
  Kind kind = 1; Config config = 2; MissionPlan mission = 3; string file_id = 4;
  string yaml_document_id = 5; string yaml_revision = 6; string yaml_patch_json = 7;
  OdinStart odin_start = 8;
  uint64 unix_time_ns = 9; // SET_TIME: 3DG computer's current Unix time.
  TaskMode task_mode = 10; // SET_TASK_MODE: select the task-machine workflow.
  string replay_bag_id = 11; // Completed mission3dg bag basename, without suffix.
  double replay_seconds = 12; // Seek position relative to the first Odin sample.
  double replay_speed = 13; // 0.25 to 4.0; zero means default speed on start.
}
message ReplayStatus {
  enum State { LIVE = 0; PLAYING = 1; PAUSED = 2; ENDED = 3; ERROR = 4; }
  State state = 1; string bag_id = 2; double position_seconds = 3;
  double duration_seconds = 4; double speed = 5; uint64 epoch = 6;
  string detail = 7;
}
message OdinStart {
  enum Mode { ODOMETRY = 0; SLAM = 1; RELOCALIZATION = 2; }
  Mode mode = 1; string map_id = 2;
}
message OdinMap {
  string id = 1; string name = 2; uint64 size_bytes = 3;
  uint64 modified_unix_ms = 4;
}
message OdinMapCatalog { repeated OdinMap maps = 1; }
message CommandResult {
  enum State { ACCEPTED = 0; SUCCEEDED = 1; FAILED = 2; }
  State state = 1; string detail = 2;
}
message Config { double cloud_hz = 1; double voxel_m = 2; string frame_id = 3;
  string map_id = 4; double clearance_m = 5; }
message YamlFile { string id = 1; string label = 2; string usage = 3; }
message YamlCatalog { repeated YamlFile files = 1; }
// JSON preserves the YAML map/list hierarchy; revision is SHA-256 of the file bytes.
// metadata_json describes selected labels, ranges and restart requirements.
message YamlDocument {
  string id = 1; string label = 2; string revision = 3;
  string content_json = 4; string metadata_json = 5; string usage = 6;
}
message LogEntry {
  enum Level { INFO = 0; WARNING = 1; ERROR = 2; }
  string source = 1; Level level = 2; string text = 3;
}
message VideoStreamInfo { string url = 1; string codec = 2; bool running = 3; }
message FileChunk {
  string file_id = 1; string name = 2; uint64 total_size = 3;
  uint64 offset = 4; bytes data = 5; bool last = 6; bytes sha256 = 7;
}
message Envelope {
  uint32 protocol_version = 1; string session_id = 2; uint64 sequence = 3;
  string request_id = 4; uint64 timestamp_ns = 5; string time_domain = 6;
  // Data samples carry the source generation. Clients discard samples from a
  // different replay epoch, including late frames from another WS channel.
  uint64 source_epoch = 7;
  oneof payload {
    Hello hello = 10; Heartbeat heartbeat = 11; VehicleState vehicle = 12;
    CompanionStatus status = 13; CloudFrame cloud = 14;
    PlannerTrajectory trajectory = 15; Command command = 16;
    CommandResult result = 17; Config config = 18; LogEntry log = 19;
    VideoStreamInfo video = 20; FileChunk file = 21;
    VoxelGrid grid = 22;
    YamlCatalog yaml_catalog = 23; YamlDocument yaml_document = 24;
    OdinMapCatalog odin_maps = 25;
    ReplayStatus replay_status = 26;
    OdinSensorPose sensor_pose = 27;
    OdinProjection projection = 28;
  }
}
